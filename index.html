<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FramigosX Holo Studio — TCG Pre-press</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23001e36'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='4' fill='none' stroke='%2331a8ff' stroke-width='2'/%3E%3Ctext x='16' y='21.5' text-anchor='middle' font-family='system-ui,sans-serif' font-weight='700' font-size='15' fill='%2331a8ff'%3EFx%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/base.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/cards.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/basic.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/reverse-holo.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/regular-holo.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/cosmos-holo.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/amazing-rare.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/radiant-holo.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/v-regular.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/v-full-art.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/v-max.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/v-star.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/trainer-full-art.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/rainbow-holo.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/rainbow-alt.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/secret-rare.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/trainer-gallery-holo.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/trainer-gallery-v-regular.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/trainer-gallery-v-max.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/trainer-gallery-secret-rare.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/shiny-rare.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/shiny-v.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/shiny-vmax.css">
  <link rel="stylesheet" data-engine="css" href="css/pokemon-cards-css/cards/swsh-pikachu.css">

  <meta id="engine-anchor">
  <meta name="theme-color" content="#262626" id="theme-color">
  <script>
    (function () {
      var dark = !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.scheme = dark ? 'dark' : 'light';
      document.getElementById('theme-color').content = dark ? '#262626' : '#e0e0e0';
    })();
  </script>
</head>
<body>
  <div class="veil" id="veil"></div>

  <div class="studio">
    <!-- Photoshop Options / Application Bar -->
    <header class="topbar">
      <div class="topbar__brand">
        <span class="ps-badge" title="FramigosX Holo Studio">Fx</span>
        <input id="project-name" class="project-input" type="text" value="FramigosX Card" aria-label="Tên dự án">
      </div>

      <div class="topbar__center">
        <div class="seg" role="group" aria-label="Mặt thẻ">
          <button type="button" data-side="front" aria-pressed="true">Mặt trước</button>
          <button type="button" data-side="back" aria-pressed="false">Mặt sau</button>
        </div>
        <div class="seg" role="group" aria-label="Chế độ xem">
          <button type="button" data-view="holo" aria-pressed="true">3D Holo</button>
          <button type="button" data-view="flat" aria-pressed="false">Flat Tách bản</button>
        </div>
        <label class="chip-check"><input type="checkbox" id="toggle-guides"><span>Guides</span></label>
        <label class="chip-check"><input type="checkbox" id="toggle-auto" checked><span>Auto xoay</span></label>
        <select id="quick-hdri" class="quick-hdri" title="HDRI Environment"></select>
      </div>

      <div class="topbar__right">
        <button type="button" class="icon-btn" id="btn-undo" title="Hoàn tác (⌘Z)" disabled>↶</button>
        <button type="button" class="icon-btn" id="btn-redo" title="Làm lại (⇧⌘Z)" disabled>↷</button>
        <button type="button" class="small-btn" id="btn-new-proj" title="Tạo dự án mới">+ Mới</button>
        <button type="button" class="small-btn" id="btn-open-proj" title="Import file .fxholo vào tab mới">Import</button>
        <button type="button" class="small-btn" id="btn-save-proj" title="Lưu dự án (.fxholo)">Lưu</button>
        <input type="file" id="input-open-proj" accept=".fxholo,.zip" hidden>
        <div class="seg" role="group" aria-label="Language">
          <button type="button" data-lang="vi" aria-pressed="true">VI</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <div class="theme" role="group" aria-label="Giao diện">
          <button type="button" data-theme="light" aria-label="Sáng" aria-pressed="false">☀</button>
          <button type="button" data-theme="dark" aria-label="Tối" aria-pressed="false">☾</button>
          <button type="button" data-theme="system" aria-pressed="true">Sys</button>
        </div>
      </div>
    </header>

    <div class="workspace">
      <!-- Photoshop Left Vertical Toolbar -->
      <nav class="ps-toolbar" aria-label="Tools">
        <button type="button" class="ps-tool is-active" data-tool="tilt" title="Tilt / Select (V)">
          <svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 2.5l9.5 6.8-4.3.9-2.2 4.3z"/></svg>
        </button>
        <button type="button" class="ps-tool" data-tool="hand" title="Hand / Pan Tool (H)">
          <svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5V4.5a1 1 0 012 0V8m0-4.5a1 1 0 012 0V8m0-3.5a1 1 0 012 0v4.8c0 2.8-1.8 4.7-4.4 4.7-2 0-3.5-1.2-4.3-3l-1.2-2.6a1 1 0 011.7-1l1.2 1.8"/></svg>
        </button>
        <button type="button" class="ps-tool" data-tool="zoom" title="Zoom Tool (Z — Click: +, Alt+Click: −)">
          <svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="4.8"/><path d="M11.6 11.6L15.5 15.5" stroke-linecap="round"/></svg>
        </button>
        <span class="ps-tool-sep"></span>
        <button type="button" class="ps-tool" id="tool-flip" title="Flip Front / Back (F)">
          <svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h10l-2.5-2.5M15 12H5l2.5 2.5"/></svg>
        </button>
        <button type="button" class="ps-tool" id="tool-guides" title="Toggle Guides (G)">
          <svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="3" y="3" width="12" height="12" stroke-dasharray="2 2"/><path d="M9 2v14M2 9h14" opacity=".45"/></svg>
        </button>
        <button type="button" class="ps-tool" id="tool-fit" title="Reset View 100% (0)">
          <svg viewBox="0 0 18 18" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 6.5V3h3.5M15 6.5V3h-3.5M3 11.5V15h3.5M15 11.5V15h-3.5"/></svg>
        </button>
      </nav>

      <!-- Center Document Canvas Area -->
      <div class="canvas-col">
        <div class="doc-tabbar">
          <div class="doc-tabs" id="doc-tabs" role="tablist" aria-label="Projects"></div>
          <div class="doc-tab-actions">
            <button type="button" id="doc-tab-new" title="Tạo dự án mới">+</button>
            <button type="button" id="doc-tab-dup" title="Nhân bản dự án hiện tại">⧉</button>
          </div>
        </div>

        <section class="stage" id="stage">
          <div class="stage-env-bg" id="stage-env-bg" hidden></div>
          <div class="stage-viewport" id="stage-viewport">
            <div class="plate" id="plate">
              <i class="tick tl"></i><i class="tick tr"></i><i class="tick bl"></i><i class="tick br"></i>
              <div id="mount" class="mount"></div>
              <div id="stage-guides" class="stage-guides" hidden></div>
            </div>

            <div class="flat-wrap" id="flat-wrap" hidden>
              <canvas id="flat-canvas" class="flat-canvas"></canvas>
              <div class="flat-bar" id="flat-bar"></div>
            </div>
          </div>
        </section>

        <!-- Photoshop Bottom Status Bar -->
        <footer class="ps-statusbar">
          <div class="viewport-hud" id="viewport-hud">
            <button type="button" id="zoom-out" title="Zoom out (−)">−</button>
            <button type="button" id="zoom-reset" title="Reset 100% (0)">100%</button>
            <button type="button" id="zoom-in" title="Zoom in (+)">+</button>
            <span class="viewport-hud__hint" id="hud-hint">Cuộn: Zoom • Space+Kéo / Chuột giữa: Pan</span>
          </div>
          <div class="stage-status" id="stage-status"></div>
        </footer>
      </div>

      <!-- Right Docked Photoshop Panels -->
      <aside class="sidebar">
        <nav class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="artwork" aria-selected="true">Artwork</button>
          <button type="button" role="tab" data-tab="holo" aria-selected="false">Holo</button>
          <button type="button" role="tab" data-tab="layers" aria-selected="false">Layers</button>
          <button type="button" role="tab" data-tab="masks" aria-selected="false">Masks</button>
          <button type="button" role="tab" data-tab="env" aria-selected="false">HDRI</button>
          <button type="button" role="tab" data-tab="specs" aria-selected="false">Specs</button>
          <button type="button" role="tab" data-tab="preflight" aria-selected="false">Preflight</button>
          <button type="button" role="tab" data-tab="export" aria-selected="false">Export</button>
        </nav>

        <div class="panel-body" id="panel-body"></div>

        <footer class="credit">
          <p class="credit__internal">FramigosX Internal Pre-press Studio</p>
          <p>Holo CSS: <a href="https://github.com/simeydotme/pokemon-cards-css" target="_blank" rel="noopener">simeydotme</a> • Base: <a href="https://github.com/fyk0620/ribi-holo" target="_blank" rel="noopener">ribi-holo</a> (GPL-3.0)</p>
        </footer>
      </aside>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
